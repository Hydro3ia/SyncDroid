name: Build Debug

on:
  push:
    branches:
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_CLI_UI_LANGUAGE: 'en-US'
  PROJECT_FILE: 'SyncDroidWinUI.csproj'

jobs:
  build-debug:
    name: Build x64 Debug
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build Debug (x64)
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $env:RUNNER_TEMP 'debug-x64'
          dotnet build $env:PROJECT_FILE `
            -c Debug `
            -r win-x64 `
            /p:Platform=x64 `
            /p:OutputPath="$outDir\"

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet build failed with exit code $LASTEXITCODE"
          }

      - name: Upload Debug build artifact (x64)
        uses: actions/upload-artifact@v4
        with:
          name: SyncDroid-Debug-x64
          path: ${{ runner.temp }}/debug-x64
          if-no-files-found: error
          retention-days: 7
